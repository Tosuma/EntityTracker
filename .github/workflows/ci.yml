name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'app-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  build_test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test release script
        shell: pwsh
        run: .\scripts\Test-New-AppRelease.ps1

      - name: Test installer swap
        shell: pwsh
        run: .\scripts\Test-InstallSwap.ps1

      - name: Test updater exit code
        shell: pwsh
        run: .\scripts\Test-UpdaterExitCode.ps1

      - name: Test installer version
        shell: pwsh
        run: .\scripts\Test-InstallerVersion.ps1

      - name: Test Docker build script
        shell: pwsh
        run: .\scripts\Test-DockerBuild.ps1

      - name: Test uninstall script
        shell: pwsh
        run: .\scripts\Test-Uninstall.ps1

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Restore
        run: dotnet restore EntityTracker.slnx

      - name: Build
        run: dotnet build EntityTracker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test EntityTracker.slnx --configuration Release --no-build --no-restore

  docker_build:
    # The installer builds the app in the Linux .NET SDK container. Windows runners can't run Linux
    # containers, so this runs the installer's own Docker build script on Linux.
    name: Build in Docker as the installer does
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build in the .NET SDK container
        shell: pwsh
        run: ./scripts/Invoke-DockerBuild.ps1 -SourcePath . -Version 0.0.0

      - name: Check the build output
        shell: pwsh
        run: |
          $publish = 'artifacts/publish/win-x64'
          foreach ($file in @('EntityTracker.Wpf.exe', 'EntityTracker.Wpf.dll', 'libSkiaSharp.dll',
                              'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt',
                              'licenses/DotNet-LICENSE.txt', 'licenses/SkiaSharp-HarfBuzzSharp-THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $file) -PathType Leaf)) {
              throw "The Docker build did not produce $file."
            }
          }

  package:
    name: Package Windows application
    # Package successful main builds and approved app tags; pull requests skip this job.
    if: ${{ github.event_name == 'push' }}
    needs: build_test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Publish Windows package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^app-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Release tags must use app-vX.Y.Z.'
            }
            $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
            .\scripts\Publish-Windows.ps1 -Configuration Release -Version $version
          } else {
            .\scripts\Publish-Windows.ps1 -Configuration Release
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EntityTracker-windows-x64-self-contained
          path: artifacts/EntityTracker-win-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
